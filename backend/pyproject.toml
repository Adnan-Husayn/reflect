[project]
name = "reflect-backend"
version = "0.3.0"
description = "Reflect (PCS26/146) — multimodal emotion analysis API"
requires-python = ">=3.11"

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
addopts = "-q --strict-markers"

[tool.ruff]
line-length = 110
target-version = "py311"
extend-exclude = ["alembic/versions"]

[tool.ruff.lint]
select = [
    "E",    # pycodestyle
    "F",    # pyflakes
    "I",    # import sorting
    "UP",   # pyupgrade
    "B",    # bugbear
    "SIM",  # simplify
    "C4",   # comprehensions
    "RUF",  # ruff-specific
]
ignore = [
    # FastAPI's dependency idiom is a function call in the argument default
    # (File(...), Depends(...)). Flagging it here would be a false positive.
    "B008",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["E501"]
# env.py must read alembic config before it can import the application.
"alembic/env.py" = ["E402"]
