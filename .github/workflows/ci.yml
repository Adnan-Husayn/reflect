name: CI

on:
  push:
    branches: [main]
  # Every pull request, not only those targeting main: a stacked PR onto
  # another feature branch got no CI at all, which is when review is
  # hardest and the checks are worth most.
  pull_request:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  backend:
    name: Backend — lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: backend

    services:
      # The unit suite runs on SQLite and needs no service. Postgres is here to
      # prove the migrations are valid on the database actually deployed —
      # a migration can pass on SQLite and still fail on Postgres.
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: reflect
          POSTGRES_PASSWORD: reflect
          POSTGRES_DB: reflect
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U reflect -d reflect"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: backend/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          # CPU-only torch keeps the runner install to a few hundred MB
          # instead of pulling the CUDA wheels, which are never used here.
          pip install torch==2.5.1 --index-url https://download.pytorch.org/whl/cpu
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        # The app has no default secret by design, so CI supplies a throwaway.
        env:
          SECRET_KEY: ci-secret-not-used-outside-this-runner
        run: pytest

      - name: Migrations apply and roll back on Postgres
        env:
          DATABASE_URL: postgresql+psycopg://reflect:reflect@localhost:5432/reflect
          SECRET_KEY: ci-secret-not-used-outside-this-runner
        run: |
          alembic upgrade head
          alembic downgrade base
          alembic upgrade head

  evaluation:
    name: Evaluation — lint and tests
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: evaluation

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
          cache-dependency-path: evaluation/requirements-dev.txt

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements-dev.txt

      - name: Lint
        run: ruff check .

      - name: Format check
        run: ruff format --check .

      - name: Tests
        run: pytest

  frontend:
    name: Frontend — types, tests, build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: npm
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Tests
        run: npm test

      - name: Build
        run: npm run build
