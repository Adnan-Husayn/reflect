services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: reflect
      POSTGRES_PASSWORD: reflect
      POSTGRES_DB: reflect
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U reflect -d reflect"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build: ./backend
    ports:
      - "8000:8000"
    environment:
      DATABASE_URL: postgresql+psycopg://reflect:reflect@db:5432/reflect
      # Local development only. Generate a real one for anything else:
      #   python -c "import secrets; print(secrets.token_urlsafe(48))"
      SECRET_KEY: ${SECRET_KEY:-local-development-secret-change-me}
      COOKIE_SECURE: "false"
    depends_on:
      db:
        condition: service_healthy
    volumes:
      - hf-cache:/root/.cache/huggingface
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 20s
      timeout: 5s
      retries: 5
      start_period: 4m

  frontend:
    build: ./frontend
    ports:
      - "5173:5173"
    depends_on:
      backend:
        condition: service_healthy

volumes:
  hf-cache:
  pgdata:
